name: Flutter

on:
  push:
    branches: [main, master]
    paths: ["frontend/**", ".github/workflows/flutter.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/flutter.yml"]

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  test:
    name: Format, analyze & tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencies resolve from the lockfile
        run: flutter pub get --enforce-lockfile

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Unit & widget tests
        run: flutter test --reporter=expanded

      - name: No secrets or debug endpoints in lib/
        run: |
          ! grep -rnE "10\.0\.2\.2|localhost:8000|BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|sk_live_|AIza[0-9A-Za-z_-]{35}" lib --include=*.dart \
            | grep -v "lib/core/config/app_config.dart"

  android:
    name: Android release build
    runs-on: ubuntu-24.04
    needs: test
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      # Without the signing secrets the build falls back to an unsigned-for-store
      # (debug-key) artifact; the CI check is that the release build compiles.
      - name: Build release app bundle (staging flavor config)
        run: >
          flutter build appbundle --release
          --dart-define=APP_ENV=staging
          --dart-define=API_BASE_URL=https://staging-api.example.invalid/api/v1
          --obfuscate --split-debug-info=build/symbols
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-bundle
          path: |
            frontend/build/app/outputs/bundle/release/*.aab
            frontend/build/symbols
          retention-days: 7

  ios:
    name: iOS release build (no codesign)
    runs-on: macos-15
    needs: test
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build iOS (signing happens in the release lane with the Apple certificates)
        run: >
          flutter build ios --release --no-codesign
          --dart-define=APP_ENV=staging
          --dart-define=API_BASE_URL=https://staging-api.example.invalid/api/v1
