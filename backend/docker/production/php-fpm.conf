; Overrides for the default [www] pool.
[global]
; Finish in-flight requests on SIGQUIT (graceful stop), up to 30 s.
process_control_timeout = 30s

[www]
listen = 9000
; Static sizing: predictable memory (≈ 60 MB × max_children) and a known
; upper bound of PostgreSQL connections per container (one per child).
pm = static
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.max_requests = 1000
request_terminate_timeout = 65s

; Container env (DB_*, REDIS_*, …) must reach PHP.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

ping.path = /fpm-ping
ping.response = pong
access.log = /dev/null
