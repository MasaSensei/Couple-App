worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Matches PHP post_max_size; ciphertext uploads only.
    client_max_body_size 30m;
    client_body_timeout 60s;

    log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id_out","method":"$request_method",'
        '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
        '"upstream":"$upstream_response_time","ip":"$remote_addr"}';
    # $uri, not $request_uri: query strings are never logged.
    access_log /dev/stdout json;

    map $http_x_request_id $request_id_out {
        default $http_x_request_id;
        ""      $request_id;
    }

    # Only trust X-Forwarded-For from the TLS proxy on the private network.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Re-resolve `app` through Docker's DNS: every deploy recreates the app
    # container with a new IP, and a cached address would mean 502 forever.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream php {
        zone php_upstream 64k;
        server app:9000 resolve;
        keepalive 16;
    }

    server {
        listen 8080 default_server;
        server_name _;
        root /var/www/html/public;
        index index.php;

        add_header X-Content-Type-Options nosniff always;

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        # Filament assets are fingerprinted.
        location ~* ^/(css|js|fonts)/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri /index.php?$query_string;
        }

        location = /index.php {
            fastcgi_pass php;
            fastcgi_keep_conn on;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param HTTP_X_REQUEST_ID $request_id_out;
            fastcgi_param HTTP_PROXY "";
            fastcgi_read_timeout 70s;
            fastcgi_buffers 16 16k;
        }

        # No other PHP file, dotfile or backup file is ever served.
        location ~ \.php$ { return 404; }
        location ~ /\. { return 404; }
    }
}
